<svg xmlns="http://www.w3.org/2000/svg" width="48" height="48" viewBox="0 0 48 48" fill="none">
  <defs>
    <!-- Ultra Bold Cyber Gradient -->
    <linearGradient id="primeGrad" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7c3aed">
        <animate attributeName="stop-color"
          values="#7c3aed;#06b6d4;#ec4899;#7c3aed"
          dur="3s" repeatCount="indefinite"/>
      </stop>
      <stop offset="100%" stop-color="#06b6d4">
        <animate attributeName="stop-color"
          values="#06b6d4;#ec4899;#7c3aed;#06b6d4"
          dur="3s" repeatCount="indefinite"/>
      </stop>
    </linearGradient>

    <!-- Clean drop shadow filter -->
    <filter id="tabGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .pulse-glow {
      transform-origin: 24px 24px;
      animation: gentlePulse 2.5s ease-in-out infinite;
    }
    @keyframes gentlePulse {
      0%, 100% { transform: scale(0.96); filter: drop-shadow(0 0 1px rgba(6, 182, 212, 0.4)); }
      50% { transform: scale(1.04); filter: drop-shadow(0 0 5px rgba(236, 72, 153, 0.7)); }
    }
  </style>

  <!-- Solid dark base background for maximum visibility in dark and light browser headers -->
  <rect width="48" height="48" rx="10" fill="#090912" stroke="#1f1f35" stroke-width="1.5"/>

  <!-- Bold, simple, recognizable FinOps vector (Clean Trend Arrow + Cloud Node) -->
  <g class="pulse-glow" filter="url(#tabGlow)" transform="translate(1, 1)">
    <!-- Upward Trend Arrow Prism -->
    <path d="M12 36 L24 24 L36 36 Z" 
          fill="url(#primeGrad)" 
          opacity="0.3" />

    <path d="M12 36 L24 12 L36 36 Z" 
          fill="none" 
          stroke="url(#primeGrad)" 
          stroke-width="5" 
          stroke-linejoin="round" 
          stroke-linecap="round" />

    <!-- Overlapping Cloud Arch (Thick high-contrast curve) -->
    <path d="M15 28 C15 24 19 22 22 24 C25 21 29 23 29 26 C32 26 33 28 32 31" 
          fill="none" 
          stroke="#ffffff" 
          stroke-width="4.5" 
          stroke-linecap="round" />

    <!-- Pulsing Oracle Core Dot (Super high contrast) -->
    <circle cx="24" cy="12" r="3.8" fill="#ffffff" />
  </g>
</svg>